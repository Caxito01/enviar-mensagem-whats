<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Link WhatsApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Gerador de Link para WhatsApp</h1>
    <form id="wa-form">
      <label for="numero">Número do WhatsApp (com DDD):</label>
      <input type="text" id="numero" name="numero" required placeholder="Ex: 11999999999">
      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" required placeholder="Digite sua mensagem..."></textarea>
      <button type="submit">Gerar Link</button>
    </form>
    <div id="resultado"></div>
    <a href="login.html" class="login-btn">Ir para Login</a>
  </div>
  <script>
    document.getElementById('wa-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const numero = document.getElementById('numero').value.replace(/\D/g, '');
      const mensagem = encodeURIComponent(document.getElementById('mensagem').value);
      const link = `https://wa.me/${numero}?text=${mensagem}`;
      document.getElementById('resultado').innerHTML = `<a href="${link}" target="_blank">Clique aqui para abrir o WhatsApp</a>`;
    });
  </script>
</body>
</html>
